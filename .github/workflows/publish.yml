name: Publish

# Publishes one package after release-please explicitly dispatches this workflow.
# Manual dispatch remains available for first-publish and recovery scenarios.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - "@effect-libs/browser"
          - "@effect-libs/browser-cdp"
          - "@effect-libs/browser-playwright"
          - "@effect-libs/browser-stagehand"
          - "@effect-libs/browser-providers"
          - "@effect-libs/cloudflare-playwright"

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` enables npm provenance attestation.
    # `contents: read` is all checkout/build needs.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve package directory
        id: resolve
        run: |
          PKG="${{ inputs.package }}"
          case "$PKG" in
            "@effect-libs/browser")                 echo "dir=packages/browser"                       >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            "@effect-libs/browser-cdp")             echo "dir=packages/browser-cdp"                  >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            "@effect-libs/browser-playwright")      echo "dir=packages/browser-playwright"           >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            "@effect-libs/browser-stagehand")       echo "dir=packages/browser-stagehand"             >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            "@effect-libs/browser-providers")       echo "dir=packages/browser-providers"             >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            "@effect-libs/cloudflare-playwright")  echo "dir=packages/cloudflare-playwright"         >> "$GITHUB_OUTPUT"; echo "name=$PKG" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown package: $PKG"; exit 1 ;;
          esac

      - name: Build
        run: pnpm --filter "${{ steps.resolve.outputs.name }}" build

      - name: Verify build output exists before publish
        run: |
          DIR="${{ steps.resolve.outputs.dir }}"
          PKG="${{ steps.resolve.outputs.name }}"
          # cloudflare-playwright is pre-built (lib/ + types/), others use dist/.
          if [ "$PKG" = "@effect-libs/cloudflare-playwright" ]; then
            if [ ! -d "$DIR/lib" ]; then
              echo "::error::lib/ directory missing in $DIR — pre-built artifacts not found"
              exit 1
            fi
            echo "lib/ OK ($(find "$DIR/lib" -type f | wc -l) files)"
          else
            if [ ! -d "$DIR/dist" ]; then
              echo "::error::dist/ directory missing in $DIR — build step produced no output"
              exit 1
            fi
            echo "dist/ OK ($(find "$DIR/dist" -type f | wc -l) files)"
          fi

      - name: Verify package metadata
        run: pnpm tsx scripts/package-metadata/check.ts --packed "${{ steps.resolve.outputs.dir }}"

      - name: Publish
        run: |
          cd "${{ steps.resolve.outputs.dir }}"
          # --no-git-checks avoids unrelated workspace changes blocking a release.
          pnpm publish --access public --no-git-checks
